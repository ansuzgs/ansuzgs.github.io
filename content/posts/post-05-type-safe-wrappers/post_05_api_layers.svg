<text xml:space="preserve" text-anchor="middle" x="1185" y="-282.3" font-family="Courier,monospace" font-size="9.00">Pattern: Type-Safe Wrappers</text>
<text xml:space="preserve" text-anchor="middle" x="1185" y="-261.5" font-family="Courier,monospace" font-size="9.00">User writes: ARRAY_PUSH(arr, int, 42)</text>
<text xml:space="preserve" text-anchor="middle" x="1185" y="-250.7" font-family="Courier,monospace" font-size="9.00">Compiler sees: int tmp = 42;</text>
<text xml:space="preserve" text-anchor="middle" x="1185" y="-239.9" font-family="Courier,monospace" font-size="9.00">Runtime checks: sizeof(int)==element_size</text>
<text xml:space="preserve" text-anchor="middle" x="1185" y="-229.1" font-family="Courier,monospace" font-size="9.00">Executes: memcpy(slot, &amp;tmp, 4)</text>
</g>
