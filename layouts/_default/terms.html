{{- define "main" }}
<header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
</header>

<div class="archive-posts">
    {{- range .Pages }}
    {{- $termPage := . }}
    <article class="post-entry">
        <header class="entry-header">
            <h2>
                {{ $termPage.Title }}
                <sup style="font-size: 0.6em; color: var(--secondary);">
                    ({{ len $termPage.Pages }} posts)
                </sup>
            </h2>
        </header>
        {{- if $termPage.Content }}
        <div class="entry-content">
            <p>{{ $termPage.Content | truncate 200 }}</p>
        </div>
        {{- end }}
        <a class="entry-link" aria-label="post link to {{ $termPage.Title }}" href="{{ $termPage.Permalink }}"></a>
    </article>
    {{- end }}
</div>
{{- end }}
