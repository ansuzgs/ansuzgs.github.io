baseURL = "https://pablogs.dev/"
title = "Void *Pablogs"
theme = "PaperMod"
enableRobotsTXT = true
pygmentsUseClasses = true
enableEmoji = true

# Syntax highlighting
[markup]
  [markup.highlight]
    noClasses = false         # Use external CSS for highlighting
    lineNos = true
    lineNumbersInTable = true
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true             # Allow raw HTML in Markdown (useful for callouts)

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

defaultContentLanguage = "en"

# ---------------------------------------------------------------------------
# LANGUAGES
# ---------------------------------------------------------------------------
[languages]

  [languages.en]
    languageName = "English"
    weight = 1
    title = "Void *Pablogs"

    [languages.en.params]
      description = "A blog about C programming, low-level concepts, and systems engineering."

    # English navigation menu
    [[languages.en.menu.main]]
      name = "Posts"
      url = "/posts/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Series"
      url = "/series/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Projects"
      url = "/projects/"
      weight = 3
    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 4

  [languages.es]
    languageName = "Español"
    weight = 2
    title = "Void *Pablogs"

    [languages.es.params]
      description = "Un blog sobre programación en C, bajo nivel y desarrollo de sistemas."

    # Spanish navigation menu
    [[languages.es.menu.main]]
      name = "Posts"
      url = "/es/posts/"
      weight = 1
    [[languages.es.menu.main]]
      name = "Series"
      url = "/es/series/"
      weight = 2
    [[languages.es.menu.main]]
      name = "Proyectos"
      url = "/es/projects/"
      weight = 3
    [[languages.es.menu.main]]
      name = "Sobre mí"
      url = "/es/about/"
      weight = 4

# ---------------------------------------------------------------------------
# GLOBAL PARAMS
# ---------------------------------------------------------------------------
[params]
  author = "Pablo"
  defaultTheme = "dark"
  disableThemeToggle = false

  # Post display options
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true    # Copy button on every code block
  ShowToc = true                # Table of contents for long posts
  TocOpen = false               # Collapsed by default
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  # Landing page hero block
  [params.homeInfoParams]
    Title = "void *pablogs"
    Content = """
Low-level C programming, systems concepts, and the occasional rabbit hole. \
Posts on allocators, data structures, OOP patterns in C, and a growing language called **Zinc**.
"""

  # Social icons shown on the home page
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ansuzgs"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/pablogonzalez21191/"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # Cover image defaults (used when a post has no explicit cover)
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  # Search (PaperMod built-in Fuse.js)
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

# ---------------------------------------------------------------------------
# BUILD / OUTPUT
# ---------------------------------------------------------------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON required for search

